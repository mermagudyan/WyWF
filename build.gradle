plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.terraformersmc.com/" }
}

loom {
	accessWidenerPath = file("src/main/resources/wywf.accesswidener")
	mods {
		"wywf" {
			sourceSet sourceSets.main
		}
	}
	runs {
		client {
			client()
			programArgs "--username", "mermagudyan", "--uuid", "ad96c39f1b2047a58b5802365e1cad34"
			if (project.hasProperty('audit')) {
				systemProperty 'wywf.audit', 'true'
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JNA for native cubiomes acceleration
    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"

    // Optional: YACL config screen
    modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}+${project.minecraft_version}-fabric"
    // ModMenu API (compile-only)
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}"}
    }

    // Include native DLL (kept under natives/ in the jar)
    from("natives") {
        into "natives"
        include "*.dll"
    }
}

// Make the native library a real resource so DEV runs (IDEA/loom) also see it.
// Placed under natives/ to match the packaged jar layout that the bridge checks.
sourceSets.main.resources {
    srcDir 'natives'
}
