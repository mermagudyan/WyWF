plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://minecraft.net" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.terraformersmc.com/" }
}

loom {
    accessWidenerPath = file("src/main/resources/wywf.accesswidener")
    mods {
        "wywf" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            programArgs "--username", "mermagudyan", "--uuid", "ad96c39f1b2047a58b5802365e1cad34"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional: YACL config screen (suggested, not required)
    implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"
    // ModMenu API (local JAR — available at compile + runtime for testing)
    implementation files("libs/modmenu-20.0.1.jar")
    // Sodium (local JAR — available at compile + runtime for testing)
    implementation files("libs/sodium-fabric-0.9.1+mc26.2.jar")

    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}"}
    }
}