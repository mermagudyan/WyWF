plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

sourceSets {
    main {
        java { srcDir "src/mc263/java" }
        resources { srcDir "src/mc263/resources" }
    }
    test {
        java { srcDir "src/mc263/test" }
    }
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://minecraft.net" }
    maven { url = "https://maven.terraformersmc.com/" }
}

def modmenuRelease = "xckkBHD5"
def modmenuJar = file("libs/modmenu-${project.modmenu_version}.jar")
if (!modmenuJar.exists()) {
    modmenuJar.parentFile.mkdirs()
    try {
        new URL("https://cdn.modrinth.com/data/mOgUt4GM/versions/${modmenuRelease}/${modmenuJar.name}").withInputStream { is ->
            modmenuJar.bytes = is.bytes
        }
        logger.lifecycle("Downloaded ModMenu API for compilation")
    } catch (Exception e) {
        logger.warn("Could not download ModMenu API: ${e.message} — ModMenu integration will not compile")
    }
}

loom {
    accessWidenerPath = file("src/mc263/resources/wywf.accesswidener")
    mods {
        "wywf" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            if (System.getenv('WYWF_ONLINE_BENCH')) {
                runDir 'build/online-benchmark-run'
                vmArg '-Xmx4G'
            }
            if (System.getProperty('os.name').startsWith('Windows')) {
                // Vulkan shader compilation can exhaust the default native thread stack
                vmArg '-Xss4M'
                // Match Minecraft 26.3 shadow space for native shader calls
                vmArg '-XX:StackShadowPages=32'
            }
            programArgs "--username", "mermagudyan", "--uuid", "ad96c39f1b2047a58b5802365e1cad34"
            if (project.hasProperty('audit')) {
                vmArg '-Dwywf.audit=true'
            }
            if (project.hasProperty('debug')) {
                vmArg '-Dwywf.debug=true'
            }
            if (providers.systemProperty('diylib.debug').getOrElse('false').equalsIgnoreCase('true')) {
                vmArg '-Ddiylib.debug=true'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    def diyLib = 'dev.diylib:diy-lib:0.1.0'
    implementation diyLib

    // JNA for native cubiomes acceleration
    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"

    // ModMenu API (compile-only — downloaded from Modrinth if missing)
    if (modmenuJar.exists()) {
        compileOnly files(modmenuJar)
    }

    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def packagedRuntime = tasks.named('jar', Jar).flatMap { it.archiveFile }
def snapshotName = "wywf-client-${UUID.randomUUID()}.jar"
def clientSnapshot = layout.file(providers.provider { new File(System.getProperty('java.io.tmpdir'), snapshotName) })

def stageClientSnapshot = tasks.register('stageClientSnapshot') {
    inputs.file(packagedRuntime)
    outputs.file(clientSnapshot)
    doLast {
        def target = clientSnapshot.get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        java.nio.file.Files.copy(packagedRuntime.get().asFile.toPath(), target)
    }
}

def deleteClientSnapshot = tasks.register('deleteClientSnapshot') {
    doLast {
        java.nio.file.Files.deleteIfExists(clientSnapshot.get().asFile.toPath())
    }
}

tasks.named('runClient', JavaExec) {
    def originalClasspath = files(new LinkedHashSet(classpath.from))
    def stagedJar = files(clientSnapshot).builtBy(stageClientSnapshot)
    setClasspath(originalClasspath.minus(sourceSets.main.output).plus(stagedJar))
    finalizedBy deleteClientSnapshot
}


test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "mc_range", project.mc_range

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "mc_range": project.mc_range
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}"}
    }

    // Native DLL now comes via sourceSets.main.resources (see below),
    // so dev runs and packaged jars share the same path.
}

// Make the native library a real resource so DEV runs (IDEA/loom) also see it:
// CubiomesBridge reads it from the mod container roots at runtime.
// One DLL serves all 26.x slots (same-slot parity old-vs-new is zero-diff).
sourceSets.main.resources {
    srcDir 'natives'
}