plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.13'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://minecraft.net" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://maven.terraformersmc.com/" }
}

def modmenuJar = file("libs/modmenu-20.0.1.jar")
if (!modmenuJar.exists()) {
    modmenuJar.parentFile.mkdirs()
    try {
        new URL("https://cdn.modrinth.com/data/mOgUt4GM/versions/njXb639R/modmenu-20.0.1.jar").withInputStream { is ->
            modmenuJar.bytes = is.bytes
        }
        logger.lifecycle("Downloaded ModMenu API for compilation")
    } catch (Exception e) {
        logger.warn("Could not download ModMenu API: ${e.message} — ModMenu integration will not compile")
    }
}

loom {
    accessWidenerPath = file("src/main/resources/wywf.accesswidener")
    mods {
        "wywf" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            programArgs "--username", "mermagudyan", "--uuid", "ad96c39f1b2047a58b5802365e1cad34"
            if (project.hasProperty('audit')) {
                systemProperty 'wywf.audit', 'true'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // JNA for native cubiomes acceleration
    implementation "net.java.dev.jna:jna:5.14.0"
    implementation "net.java.dev.jna:jna-platform:5.14.0"

    // Optional: YACL config screen (suggested, not required)
    compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}+${project.minecraft_version}-fabric"
    // ModMenu API (compile-only — downloaded from Modrinth if missing)
    if (modmenuJar.exists()) {
        compileOnly files(modmenuJar)
    }

    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName}"}
    }

    // Native DLL now comes via sourceSets.main.resources (see below),
    // so dev runs and packaged jars share the same path.
}

// Make the native library a real resource so DEV runs (IDEA/loom) also see it:
// CubiomesBridge reads it from the mod container roots at runtime.
sourceSets.main.resources {
    srcDir 'natives'
}