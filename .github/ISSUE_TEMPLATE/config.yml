# Configuration for issue templates
# See: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository#configuring-the-template-chooser

blank_issues_enabled: false
contact_links:
  - name: 📖 Read the documentation
    url: https://github.com/mermagudyan/WyWF/blob/main/README.md
    about: Check the README before opening an issue. Many common questions are answered there.
  - name: 💬 Ask a question
    url: https://github.com/mermagudyan/WyWF/discussions
    about: For general questions, please use GitHub Discussions instead of opening an issue.
  - name: 🔒 Report a security vulnerability
    url: https://github.com/mermagudyan/WyWF/security/policy
    about: Please report security vulnerabilities privately. Do NOT open a public issue.
  - name: 🌐 Minecraft bug tracker
    url: https://bugs.mojang.com
    about: Bugs in Minecraft itself should be reported to Mojang, not here.
  - name: 🧵 Fabric Loader / API issues
    url: https://github.com/FabricMC/fabric/issues
    about: Issues with Fabric Loader or Fabric API should be reported upstream.
