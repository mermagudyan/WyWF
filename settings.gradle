pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom' version '1.17.13'
    }
}

rootProject.name = 'wywtf'
def diyLibDir = file(providers.gradleProperty('diyLibDir').getOrElse('../diy-lib'))
if (new File(diyLibDir, 'settings.gradle').isFile()) {
    includeBuild(diyLibDir)
}
